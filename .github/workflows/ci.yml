name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: verify y tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS trae bash 3.2 y Windows, Git Bash: los dos entornos de la sala que más fallan.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: bash 3.2 de macOS por delante
        if: runner.os == 'macOS'
        run: echo "/bin" >> "$GITHUB_PATH"
      - name: versiones
        run: bash --version | head -n 1 && node --version
      - name: tools/verify.sh
        run: bash tools/verify.sh
      - name: tools/test.sh
        run: bash tools/test.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=error tools/*.sh tools/lib/*.sh asset-sets/*/hooks/*.sh asset-sets/*/skills/*/scripts/*.sh
